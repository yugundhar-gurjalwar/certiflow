name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: certiflow_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "server/package-lock.json" }
      - name: Server typecheck + tests (real Postgres and Redis)
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/certiflow_test
          TEST_REDIS_URL: redis://localhost:6379/1
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Web typecheck + build
        working-directory: web
        run: |
          npm ci
          npm run build
